######################################################################################
###################################### haproxy #######################################
######################################################################################
kind: Deployment
apiVersion: apps/v1
metadata:
  name: haproxy
  namespace: hcce
  labels:
    app: haproxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haproxy
  template:
    metadata:
      labels:
        app: haproxy
        name: haproxy
    spec:
      # hostNetwork: true
      serviceAccountName: haproxy-sa
      terminationGracePeriodSeconds: 60
      containers:
        - name: haproxy
          image: mozillareality/haproxy:stable-latest
          args:
            - --configmap=hcce/haproxy-config
            - --https-bind-port=4443
            - --http-bind-port=8080
            - --configmap-tcp-services=hcce/haproxy-tcp-config
            - --ingress.class=haproxy
            - --log=warning #error warning info debug trace
#            - --default-ssl-certificate=hcce/cert-hcce
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          livenessProbe:
            httpGet:
              path: /healthz
              port: 1042
          env:
            - name: TZ
              value: "Etc/UTC"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
---
apiVersion: v1
kind: Service
metadata:
  name: lb
  namespace: hcce
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: haproxy
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: https
      port: 443
      targetPort: 4443
    - name: dialog
      port: 4443
      targetPort: 4443
    - name: turn
      port: 5349
      targetPort: 5349
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: haproxy-sa
  namespace: hcce
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: haproxy-cr
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - nodes
      - pods
      - namespaces
      - events
      - serviceaccounts
      - services
      - endpoints
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - "extensions"
      - "networking.k8s.io"
    resources:
      - ingresses
      - ingresses/status
      - ingressclasses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - "extensions"
      - "networking.k8s.io"
    resources:
      - ingresses/status
    verbs:
      - update
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
  - apiGroups:
      - core.haproxy.org
    resources:
      - '*'
    verbs:
      - get
      - list
      - watch
      - update
  - apiGroups:
      - "discovery.k8s.io"
    resources:
      - '*'
    verbs:
      - get
      - list
      - watch
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: haproxy-rb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: haproxy-cr
subjects:
  - kind: ServiceAccount
    name: haproxy-sa
    namespace: hcce
