apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ret
  namespace: hcce
  annotations:
    kubernetes.io/ingress.class: haproxy
    haproxy.org/response-set-header: |
      access-control-allow-origin "https://prod.ncc.mx"
    haproxy.org/path-rewrite: /api-internal(.*) /_drop_
spec:
  tls:
    - hosts:
        - prod.ncc.mx
      secretName: cert-prod.ncc.mx
    - hosts:
        - assets.prod.ncc.mx
      secretName: cert-assets.prod.ncc.mx
    - hosts:
        - stream.prod.ncc.mx
      secretName: cert-stream.prod.ncc.mx
    - hosts:
        - cors.prod.ncc.mx
      secretName: cert-cors.prod.ncc.mx
  rules:
    - host: prod.ncc.mx
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ret
                port:
                  number: 4001
    - host: assets.prod.ncc.mx
      http:
        paths:
          - path: /files/
            pathType: Prefix
            backend:
              service:
                name: ret
                port:
                  number: 4001
          - path: /http
            pathType: ImplementationSpecific # haproxy's "Begin with"
            backend:
              service:
                name: ret
                port:
                  number: 4001
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: hubs
                port:
                  number: 8080
          - path: /spoke
            pathType: Prefix
            backend:
              service:
                name: spoke
                port:
                  number: 8080
    - host: cors.prod.ncc.mx
      http:
        paths:
          - path: /files/
            pathType: Prefix
            backend:
              service:
                name: ret
                port:
                  number: 4001
          - path: /http
            pathType: ImplementationSpecific
            backend:
              service:
                name: ret
                port:
                  number: 4001
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: hubs
                port:
                  number: 8080
          - path: /spoke
            pathType: Prefix
            backend:
              service:
                name: spoke
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dialog
  namespace: hcce
  annotations:
    kubernetes.io/ingress.class: haproxy
    haproxy.org/server-ssl: "true"
    haproxy.org/load-balance: "url_param roomId"
spec:
  tls:
    - hosts:
        - stream.prod.ncc.mx
      secretName: cert-stream.prod.ncc.mx
  rules:
    - host: stream.prod.ncc.mx
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dialog
                port:
                  number: 4443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nearspark
  namespace: hcce
  annotations:
    kubernetes.io/ingress.class: haproxy
    haproxy.org/path-rewrite: /nearspark/(.*) /\1
spec:
  tls:
    - hosts:
        - cors.prod.ncc.mx
      secretName: cert-cors.prod.ncc.mx
  rules:
    - host: cors.prod.ncc.mx
      http:
        paths:
          - path: /nearspark
            pathType: Prefix
            backend:
              service:
                name: nearspark
                port:
                  number: 5000
---
