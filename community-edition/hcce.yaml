apiVersion: apps/v1
kind: Deployment
metadata:
  name: reticulum
  namespace: hcce
  annotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reticulum
  minReadySeconds: 15
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  revisionHistoryLimit: 1
  template:
    metadata:
      labels:
        app: reticulum
    spec:
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: ret-pvc
        - name: config
          configMap:
            name: ret-config
      containers:
        - name: reticulum
          volumeMounts:
            - name: storage
              mountPath: /storage
              mountPropagation: Bidirectional
            - name: config
              mountPath: /home/ret
          securityContext:
            privileged: true
          image: hubsfoundation/reticulum:stable-latest
          ports:
            - containerPort: 9100
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: turkeyCfg_POD_NS
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: turkeyCfg_NODE_COOKIE
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: NODE_COOKIE
            - name: turkeyCfg_HUB_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: HUB_DOMAIN
            - name: turkeyCfg_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: HUB_DOMAIN
            - name: turkeyCfg_DB_USER
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: DB_USER
            - name: turkeyCfg_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: DB_PASS
            - name: turkeyCfg_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: DB_NAME
            - name: turkeyCfg_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: DB_HOST
            - name: turkeyCfg_DB_HOST_T
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: DB_HOST_T
            - name: turkeyCfg_GUARDIAN_KEY
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: GUARDIAN_KEY
            - name: turkeyCfg_PERMS_KEY
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: PERMS_KEY
            - name: turkeyCfg_PHX_KEY
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: PHX_KEY
            - name: turkeyCfg_SMTP_SERVER
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: SMTP_SERVER
            - name: turkeyCfg_SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: SMTP_PORT
            - name: turkeyCfg_SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: SMTP_USER
            - name: turkeyCfg_SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: SMTP_PASS
            - name: turkeyCfg_ADM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: ADM_EMAIL
            - name: turkeyCfg_SKETCHFAB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: SKETCHFAB_API_KEY
            - name: turkeyCfg_IMG_PROXY
              value: nearspark.hcce
            - name: turkeyCfg_TENOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: TENOR_API_KEY
            - name: turkeyCfg_YTDL_HOST
              value: http://ytdl:5000
            - name: turkeyCfg_PHOTOMNEMONIC
              value: http://photomnemonic:5000
            - name: turkeyCfg_SPEELYCAPTOR
              value: http://speelycaptor:5000
            - name: turkeyCfg_STORAGE_QUOTA_GB
              value: "1000"
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
              scheme: HTTP
            initialDelaySeconds: 30
            timeoutSeconds: 3
            periodSeconds: 30
          readinessProbe:
            initialDelaySeconds: 20
            httpGet:
              path: /?skipadmin
              port: 4001
              scheme: HTTP
            timeoutSeconds: 5
            periodSeconds: 5
            successThreshold: 5
            failureThreshold: 100
        - name: postgrest
          image: mozillareality/postgrest:stable-latest
          ports:
            - containerPort: 3000
          imagePullPolicy: IfNotPresent
          env:
            - name: PGRST_LOG_LEVEL
              value: info
            - name: PGRST_DB_SCHEMA
              value: ret0_admin
            - name: PGRST_DB_ANON_ROLE
              value: postgres
            - name: PGRST_DB_URI
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: PGRST_DB_URI
            - name: PGRST_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: PGRST_JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: ret
  namespace: hcce
spec:
  clusterIP: None
  ports:
    - name: http-reticulum
      port: 4001
      targetPort: 4001
    - name: https-reticulum
      port: 4000
      targetPort: 4000
  selector:
    app: reticulum
---
########################################################################
######################   pgsql   #######################################
########################################################################
apiVersion: v1
kind: Service
metadata:
  name: pgsql
  namespace: hcce
spec:
  selector:
    app: pgsql
  ports:
    - name: postgresql
      protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgsql
  namespace: hcce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgsql
  template:
    metadata:
      labels:
        app: pgsql
    spec:
      containers:
        - name: postgresql
          image: mozillareality/postgres:stable-latest
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: DB_PASS
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: DB_NAME
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgresql-data
          persistentVolumeClaim:
            claimName: pgsql-pvc
---
####################################################################################
################################### pgbouncer ######################################
####################################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: hcce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer
  minReadySeconds: 2
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - image: mozillareality/pgbouncer:stable-latest
          imagePullPolicy: IfNotPresent
          name: pgbouncer
          env:
            - name: MAX_CLIENT_CONN
              value: "10000"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: DB_PASS
